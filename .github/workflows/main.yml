name: Build NoahOS ISO
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          df -h /
      - name: Build ISO
        run: sudo ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: NoahOS-1.0-iso
          path: NoahOS-1.0.iso
          compression-level: 0
